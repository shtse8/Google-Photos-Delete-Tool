<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
  <title>Google Photos Delete Tool</title>
</head>
<body>
  <main class="app">

    <!-- ─── Header ──────────────────────────────────────────────── -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon" id="brand-icon" aria-hidden="true"></span>
        <div class="brand-text">
          <h1 class="brand-title" data-i18n="header.title">Photos Cleanup</h1>
          <p class="brand-subtitle" data-i18n="header.subtitle">Google Photos bulk delete</p>
        </div>
      </div>
      <div class="lang-picker">
        <button
          class="lang-trigger"
          id="lang-trigger"
          aria-haspopup="listbox"
          aria-expanded="false"
          aria-controls="lang-menu"
          data-i18n-attr="aria-label:settings.language.trigger"
        >
          <span class="lang-icon" id="lang-icon" aria-hidden="true"></span>
          <span class="lang-code" id="lang-code">EN</span>
          <span class="lang-chevron" id="lang-chevron" aria-hidden="true"></span>
        </button>
        <ul
          class="lang-menu hidden"
          id="lang-menu"
          role="listbox"
          data-i18n-attr="aria-label:settings.language.label"
        ></ul>
      </div>
    </header>

    <!-- ─── Status pill ─────────────────────────────────────────── -->
    <div class="status" id="status">
      <span class="status-dot" id="status-dot"></span>
      <span class="status-text" id="status-text" data-i18n="status.ready">Ready</span>
    </div>

    <!-- ─── Error banner ────────────────────────────────────────── -->
    <div class="error hidden" id="error" role="alert">
      <span class="error-icon" id="error-icon" aria-hidden="true"></span>
      <span class="error-text" id="error-text"></span>
    </div>

    <!-- ─── Stats grid ──────────────────────────────────────────── -->
    <section class="stats" data-i18n-attr="aria-label:stats.sectionLabel" aria-label="Stats">
      <article class="stat">
        <div class="stat-value" id="stat-deleted">0</div>
        <div class="stat-label" data-i18n="stats.deleted">Deleted</div>
      </article>
      <article class="stat">
        <div class="stat-value" id="stat-rate">—</div>
        <div class="stat-label" data-i18n="stats.rate">Per minute</div>
      </article>
      <article class="stat">
        <div class="stat-value" id="stat-elapsed">0s</div>
        <div class="stat-label" data-i18n="stats.elapsed">Elapsed</div>
      </article>
      <article class="stat">
        <div class="stat-value" id="stat-eta">—</div>
        <div class="stat-label" data-i18n="stats.eta">ETA</div>
      </article>
    </section>

    <!-- ─── Progress bar ────────────────────────────────────────── -->
    <div class="progress">
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <span class="progress-label" id="progress-label">0</span>
    </div>

    <!-- ─── Settings ────────────────────────────────────────────── -->
    <section class="settings" id="settings-panel">
      <header class="settings-header">
        <span class="settings-icon" id="settings-icon" aria-hidden="true"></span>
        <span class="settings-title" data-i18n="settings.sectionLabel">Settings</span>
      </header>

      <div class="field">
        <label class="field-label" for="max-count">
          <span class="field-icon" id="field-icon-max" aria-hidden="true"></span>
          <span class="field-text">
            <span class="field-name" data-i18n="settings.maxCount.label">Photos per batch</span>
            <span class="field-hint" data-i18n="settings.maxCount.hint">Looped until the gallery is empty</span>
          </span>
        </label>
        <input
          type="number"
          id="max-count"
          class="field-input"
          value="500"
          min="1"
          max="2000"
          step="50"
          inputmode="numeric"
        >
      </div>

      <div class="field">
        <label class="field-label" for="dry-run">
          <span class="field-icon" id="field-icon-dry" aria-hidden="true"></span>
          <span class="field-text">
            <span class="field-name" data-i18n="settings.dryRun.label">Dry run</span>
            <span class="field-hint" data-i18n="settings.dryRun.hint">Count only, no deletion</span>
          </span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="dry-run">
          <span class="toggle-track">
            <span class="toggle-thumb"></span>
          </span>
        </label>
      </div>

      <div class="field">
        <label class="field-label" for="empty-trash">
          <span class="field-icon field-icon-danger" id="field-icon-empty" aria-hidden="true"></span>
          <span class="field-text">
            <span class="field-name" data-i18n="settings.emptyTrash.label">Empty trash</span>
            <span class="field-hint" data-i18n="settings.emptyTrash.hint">Permanently delete afterwards</span>
          </span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="empty-trash">
          <span class="toggle-track toggle-track-danger">
            <span class="toggle-thumb"></span>
          </span>
        </label>
      </div>

      <div class="field">
        <label class="field-label" for="filter">
          <span class="field-icon" id="field-icon-filter" aria-hidden="true"></span>
          <span class="field-text">
            <span class="field-name" data-i18n="settings.filter.label">Filter</span>
            <span class="field-hint" data-i18n="settings.filter.hint">Pro: restrict cleanup by type</span>
          </span>
        </label>
        <select id="filter" class="field-input" disabled>
          <option value="all" data-i18n="settings.filter.all">All items</option>
          <option value="screenshot" data-i18n="settings.filter.screenshot">Screenshots</option>
          <option value="video" data-i18n="settings.filter.video">Videos</option>
          <option value="photo" data-i18n="settings.filter.photo">Photos</option>
          <option value="animation" data-i18n="settings.filter.animation">Animations</option>
          <option value="collage" data-i18n="settings.filter.collage">Collages</option>
        </select>
      </div>

      <div class="field">
        <label class="field-label" for="license-token">
          <span class="field-icon" id="field-icon-license" aria-hidden="true"></span>
          <span class="field-text">
            <span class="field-name" data-i18n="settings.license.label">Pro license</span>
            <span class="field-hint" data-i18n="settings.license.hint">Verified locally; never leaves your device</span>
          </span>
        </label>
        <input type="text" id="license-token" class="field-input" placeholder="" autocomplete="off" spellcheck="false">
      </div>
      <button class="btn btn-ghost btn-block" id="license-btn" data-i18n-attr="aria-label:settings.license.activate">
        <span class="btn-text" data-i18n="settings.license.activate">Activate</span>
      </button>
      <p class="license-status" id="license-status"></p>
    </section>

    <!-- ─── Consent gate (destructive runs) ─────────────────────── -->
    <section class="consent hidden" id="consent" aria-labelledby="consent-title">
      <h2 class="consent-title" id="consent-title" data-i18n="consent.title">Before you start</h2>
      <p class="consent-note" data-i18n="consent.trashNote">Photos move to Trash (recoverable for 60 days).</p>
      <p class="consent-danger hidden" id="consent-permanent" data-i18n="consent.permanentNote">"Empty trash afterwards" is PERMANENT — no recovery.</p>
      <label class="consent-check">
        <input type="checkbox" id="consent-check">
        <span data-i18n="consent.check">I understand, and I am on the Google Photos view I intend to clean.</span>
      </label>
      <div class="consent-actions">
        <button class="btn btn-danger" id="consent-confirm" data-i18n-attr="aria-label:consent.confirm">
          <span class="btn-text" data-i18n="consent.confirm">Confirm &amp; Start</span>
        </button>
        <button class="btn btn-ghost" id="consent-cancel" data-i18n-attr="aria-label:consent.cancel">
          <span class="btn-text" data-i18n="consent.cancel">Cancel</span>
        </button>
      </div>
    </section>

    <!-- ─── Controls ────────────────────────────────────────────── -->
    <div class="controls">
      <button class="btn btn-primary" id="start-btn" data-i18n-attr="aria-label:actions.start">
        <span class="btn-icon" id="start-icon" aria-hidden="true"></span>
        <span class="btn-text" data-i18n="actions.start">Start</span>
      </button>
      <button class="btn btn-warning hidden" id="pause-btn" data-i18n-attr="aria-label:actions.pause">
        <span class="btn-icon" id="pause-icon" aria-hidden="true"></span>
        <span class="btn-text" data-i18n="actions.pause">Pause</span>
      </button>
      <button class="btn btn-primary hidden" id="resume-btn" data-i18n-attr="aria-label:actions.resume">
        <span class="btn-icon" id="resume-icon" aria-hidden="true"></span>
        <span class="btn-text" data-i18n="actions.resume">Resume</span>
      </button>
      <button class="btn btn-danger hidden" id="stop-btn" data-i18n-attr="aria-label:actions.stop">
        <span class="btn-icon" id="stop-icon" aria-hidden="true"></span>
        <span class="btn-text" data-i18n="actions.stop">Stop</span>
      </button>
    </div>

    <!-- ─── Utility row ─────────────────────────────────────────── -->
    <div class="utility hidden" id="utility">
      <button class="btn btn-ghost" id="copy-btn" data-i18n-attr="aria-label:actions.copySummary">
        <span class="btn-text" data-i18n="actions.copySummary">Copy summary</span>
      </button>
      <button class="btn btn-ghost hidden" id="export-btn" data-i18n-attr="aria-label:actions.exportCsv">
        <span class="btn-text" data-i18n="actions.exportCsv">Export CSV</span>
      </button>
      <button class="btn btn-ghost" id="trash-btn" data-i18n-attr="aria-label:actions.viewTrash">
        <span class="btn-text" data-i18n="actions.viewTrash">View trash</span>
      </button>
      <button class="btn btn-ghost" id="report-btn" data-i18n-attr="aria-label:actions.report">
        <span class="btn-text" data-i18n="actions.report">Report issue</span>
      </button>
    </div>

    <!-- Note uses role="status" (polite) rather than role="alert" so it
         doesn't fight with the actual error banner above for screen-
         reader attention. -->
    <p class="note hidden" id="note" role="status"></p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
