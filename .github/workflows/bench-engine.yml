name: Engine benchmark

# Mock-grid throughput and heap harness (scripts/bench/engine.ts). Fails only
# when a run is more than 2x worse than bench/engine-baseline.json, so the
# budget can only be tightened later by committing a better baseline.
on:
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'scripts/bench/**'
      - 'bench/**'
      - '.github/workflows/bench-engine.yml'

jobs:
  bench:
    name: Engine throughput and heap (mock grid)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run engine benchmark
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: bun run bench:engine --check --out bench-engine.json

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-engine
          path: bench-engine.json
          if-no-files-found: ignore
