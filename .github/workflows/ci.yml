name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    name: Lint, Type Check, Test, Build & Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Find duplicates end to end (test page, no Google account)
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: node scripts/dupes-demo.mjs --check --no-screenshot

      - name: Verify storefront listing
        run: bun run listing:check

      - name: Verify artifacts
        run: bun run verify

      - name: Zip
        run: bun run zip
