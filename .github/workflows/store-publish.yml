name: Store Publish (reusable)

# Single publish engine for every store. Called by:
#   - publish-stores.yml  (workflow_dispatch — publish now)
#   - store-retry.yml     (scheduled — publish the latest release tag as
#                          soon as each store's review queue allows)
#   - publish-cws.yml     (workflow_dispatch — one tag to CWS, or with
#                          staged_ref: the cws-staged job builds that commit,
#                          pins it by content digest and submits it with
#                          STAGED_PUBLISH; it never publishes, tags or records
#                          store-state, and every tag job is skipped)
#
# Model: a git tag creates GitHub release assets only. Stores are
# decoupled, stateful, and retryable:
#   - store-state branch records accepted submissions per store (state.json)
#   - a store is published only when its recorded state is behind the
#     target tag
#   - platform review blocks (ITEM_NOT_UPDATABLE, InProgressSubmission,
#     NoModulesUpdated) are expected states: the run exits 0 with a
#     notice and retries on the next schedule — never a red CI on a
#     Google/Microsoft queue
#   - real failures (auth, validation) exit 1 and do NOT advance state
#
# Evidence: submission acceptance is recorded after platform API readback
# (CWS publish status, Edge operation status, AMO API response). This does
# not establish review completion or the live public version.

on:
  workflow_call:
    inputs:
      stores:
        description: 'Stores to consider: cws,edge,amo (comma list) or auto'
        required: true
        type: string
      tag:
        description: 'Git tag to build and publish (default: latest release tag)'
        required: false
        type: string
        default: ''
      cancel_pending:
        description: 'CWS only: cancel a pending review before upload (manual publish-cws.yml dispatch only; never the scheduled retry)'
        required: false
        type: boolean
        default: false
      staged_ref:
        description: 'CWS only: build this commit and submit it with STAGED_PUBLISH instead of publishing a tag (manual publish-cws.yml dispatch only)'
        required: false
        type: string
        default: ''
      content_digest:
        description: 'With staged_ref: expected content digest of the Chrome zip (scripts/zip-content-digest.sh)'
        required: false
        type: string
        default: ''
      publisher_id:
        description: 'With staged_ref: CWS publisher id (not a secret); blank = the CWS_PUBLISHER_ID repo variable or secret'
        required: false
        type: string
        default: ''
    secrets:
      CWS_SERVICE_ACCOUNT_JSON:
        required: false
      CWS_PUBLISHER_ID:
        required: false
      CHROME_EXTENSION_ID:
        required: false
      CHROME_CLIENT_ID:
        required: false
      CHROME_CLIENT_SECRET:
        required: false
      CHROME_REFRESH_TOKEN:
        required: false
      EDGE_CLIENT_ID:
        required: false
      EDGE_API_KEY:
        required: false
      EDGE_PRODUCT_ID:
        required: false
      FIREFOX_JWT_ISSUER:
        required: false
      FIREFOX_JWT_SECRET:
        required: false

jobs:
  resolve:
    name: Resolve target tag & pending stores
    if: inputs.staged_ref == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      stores: ${{ steps.resolve.outputs.stores }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve tag and pending stores
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(gh release view --json tagName -q .tagName)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          git fetch origin store-state:refs/remotes/origin/store-state --depth=1 || true
          PENDING=""
          for store in cws edge amo; do
            STATUS="$(node scripts/store-state.mjs pending "$store" "$TAG" 2>/dev/null || echo pending)"
            if [ "$STATUS" = "pending" ]; then
              PENDING="${PENDING:+$PENDING,}$store"
            fi
          done

          REQUESTED="${{ inputs.stores }}"
          if [ "$REQUESTED" = "auto" ]; then
            echo "stores=$PENDING" >> "$GITHUB_OUTPUT"
          else
            SELECTED=""
            for store in ${REQUESTED//,/ }; do
              case ",$PENDING," in
                *",$store,"*) SELECTED="${SELECTED:+$SELECTED,}$store" ;;
                *) echo "::notice::$store submission already recorded for $TAG (or unknown store); skipped" ;;
              esac
            done
            echo "stores=$SELECTED" >> "$GITHUB_OUTPUT"
          fi
          echo "target=$TAG pending=[$PENDING] requested=[$REQUESTED] selected=[${SELECTED:-}]"

  build:
    name: Build tag artifacts
    needs: resolve
    if: needs.resolve.outputs.stores != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Assert tag matches package version
        run: |
          TAG="${{ needs.resolve.outputs.tag }}"
          PKG="$(bun -e 'console.log(JSON.parse(require("fs").readFileSync("package.json","utf8")).version)')"
          test "${TAG#v}" = "$PKG" || { echo "::error::release tag $TAG does not match package.json version ($PKG)"; exit 1; }

      - name: Build
        run: bun run build

      - name: Verify artifacts
        run: bun run verify

      - name: Create extension ZIPs
        run: bun run zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: store-zips
          path: |
            google-photos-delete-tool.zip
            google-photos-delete-tool-edge.zip
            google-photos-delete-tool-firefox.zip
          retention-days: 7

  # ─────────────────────────── Chrome Web Store ───────────────────
  cws:
    name: Publish to Chrome Web Store
    needs: [resolve, build]
    if: contains(needs.resolve.outputs.stores, 'cws')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Chrome Web Store API v2 only (the v1.1 API the old upload CLI called shuts
      # down on 2026-10-15). A service account wins when CWS_SERVICE_ACCOUNT_JSON
      # is set; otherwise an access token is minted from the CHROME_* OAuth
      # refresh-token secrets. Both need the publisher id, which is not a secret:
      # the CWS_PUBLISHER_ID repo variable (a secret of that name also works).
      - name: Credential guard
        id: creds
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID || vars.CWS_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          MODE="$(node scripts/cws-v2.mjs mode)"
          echo "auth=$MODE" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = "none" ]; then
            echo "::notice::CWS skipped: no service account or CHROME_* secrets configured (see docs/STORE_AUTOMATION.md)"
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CWS auth path: $MODE"
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Store state check
        id: state
        if: steps.creds.outputs.ready == 'yes'
        run: |
          git fetch origin store-state:refs/remotes/origin/store-state --depth=1 || true
          echo "status=$(node scripts/store-state.mjs pending cws ${{ needs.resolve.outputs.tag }})" >> "$GITHUB_OUTPUT"

      - name: Already recorded
        if: steps.creds.outputs.ready == 'yes' && steps.state.outputs.status != 'pending'
        run: echo "::notice::CWS submission already recorded for ${{ needs.resolve.outputs.tag }}; nothing to do (public version unverified)"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.creds.outputs.ready == 'yes' && steps.state.outputs.status == 'pending'
        with:
          name: store-zips
          path: zips

      # Upload, publish (one retry after 10 min on a reachability error) and read
      # back through the v2 API. A submission already in review exits 0 with
      # blocked=yes and no state change; any real failure exits 1.
      - name: Publish via Chrome Web Store API v2
        id: v2
        if: steps.creds.outputs.ready == 'yes' && steps.state.outputs.status == 'pending'
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID || vars.CWS_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CANCEL_PENDING: ${{ inputs.cancel_pending && 'true' || 'false' }}
        run: |
          ARGS=(publish --zip zips/google-photos-delete-tool.zip)
          if [ "$CANCEL_PENDING" = "true" ]; then ARGS+=(--cancel-pending); fi
          node scripts/cws-v2.mjs "${ARGS[@]}"

      - name: Record submitted state
        if: steps.v2.outputs.published == 'yes'
        run: |
          set -euo pipefail
          STATE_FILE=/tmp/store-state.json node scripts/store-state.mjs set cws ${{ needs.resolve.outputs.tag }}
          git fetch origin store-state:refs/remotes/origin/store-state --depth=1 || git fetch origin
          if git rev-parse --verify origin/store-state >/dev/null 2>&1; then
            git checkout --detach origin/store-state
          else
            git checkout --orphan store-state --quiet
            git rm -rf . --quiet
          fi
          cp /tmp/store-state.json state.json
          git add state.json
          if git diff --cached --quiet; then
            echo "No staged state changes; commit skipped"
          else
            DIFF_RC=$?
            [ "$DIFF_RC" -eq 1 ] || exit "$DIFF_RC"
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "store-state: cws=${{ needs.resolve.outputs.tag }}" --quiet
          fi
          git push origin HEAD:store-state
          echo "::notice::CWS ${{ needs.resolve.outputs.tag }} submission accepted; state recorded (public version unverified)"


  # ──────────────────────── Microsoft Edge Add-ons ────────────────
  edge:
    name: Publish to Microsoft Edge Add-ons
    needs: [resolve, build]
    if: contains(needs.resolve.outputs.stores, 'edge')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Credential guard
        id: creds
        env:
          HAS_EDGE: ${{ secrets.EDGE_CLIENT_ID != '' && secrets.EDGE_API_KEY != '' && secrets.EDGE_PRODUCT_ID != '' }}
        run: |
          if [ "$HAS_EDGE" = "true" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Edge skipped: EDGE_CLIENT_ID / EDGE_API_KEY / EDGE_PRODUCT_ID secrets not configured (see docs/STORE_AUTOMATION.md)"
            echo "ready=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Store state check
        id: state
        if: steps.creds.outputs.ready == 'yes'
        run: |
          git fetch origin store-state:refs/remotes/origin/store-state --depth=1 || true
          echo "status=$(node scripts/store-state.mjs pending edge ${{ needs.resolve.outputs.tag }})" >> "$GITHUB_OUTPUT"

      - name: Already recorded
        if: steps.creds.outputs.ready == 'yes' && steps.state.outputs.status != 'pending'
        run: echo "::notice::Edge submission already recorded for ${{ needs.resolve.outputs.tag }}; nothing to do (public version unverified)"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.creds.outputs.ready == 'yes' && steps.state.outputs.status == 'pending'
        with:
          name: store-zips
          path: zips

      - name: Upload package to Edge draft
        id: upload
        if: steps.creds.outputs.ready == 'yes' && steps.state.outputs.status == 'pending'
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
        run: |
          set -euo pipefail
          RESP="$(curl -sS -i -X POST \
            -H "Authorization: ApiKey $EDGE_API_KEY" \
            -H "X-ClientID: $EDGE_CLIENT_ID" \
            -H "Content-Type: application/zip" \
            --data-binary @zips/google-photos-delete-tool-edge.zip \
            https://api.addons.microsoftedge.microsoft.com/v1/products/$EDGE_PRODUCT_ID/submissions/draft/package || true)"
          CODE="$(printf '%s' "$RESP" | head -1 | awk '{print $2}')"
          printf '%s\n' "$RESP" | tail -20
          if [ "$CODE" != "202" ]; then
            echo "::error::Edge upload failed (HTTP $CODE) — see response above"
            exit 1
          fi
          OP="$(printf '%s' "$RESP" | grep -io 'location:[^[:space:]]*' | head -1 | cut -d: -f2 | tr -d '\r')"
          if [ -z "$OP" ]; then
            echo "::error::Edge upload returned 202 but no Location operation ID"
            exit 1
          fi
          echo "op=$OP" >> "$GITHUB_OUTPUT"
          echo "uploaded=yes" >> "$GITHUB_OUTPUT"

      - name: Wait for Edge package processing
        if: steps.upload.outputs.uploaded == 'yes'
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            BODY="$(curl -sS -X GET \
              -H "Authorization: ApiKey $EDGE_API_KEY" \
              -H "X-ClientID: $EDGE_CLIENT_ID" \
              https://api.addons.microsoftedge.microsoft.com/v1/products/$EDGE_PRODUCT_ID/submissions/draft/package/operations/${{ steps.upload.outputs.op }})"
            STATUS="$(printf '%s' "$BODY" | jq -r .status)"
            echo "edge package status: $STATUS (attempt $i/30)"
            if [ "$STATUS" = "Succeeded" ]; then
              echo "processed=yes" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$STATUS" = "Failed" ]; then
              printf '%s' "$BODY" | jq .
              echo "::error::Edge package processing failed"
              exit 1
            fi
            sleep 20
          done
          echo "::error::Edge package still processing after 10 minutes"
          exit 1

      - name: Publish Edge draft submission
        id: publish
        if: steps.upload.outputs.uploaded == 'yes'
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
        run: |
          set -euo pipefail
          NOTES='{"notes":"Release ${{ needs.resolve.outputs.tag }}. Open-source extension; DOM automation clicks the same UI elements a user would. Source: https://github.com/SylphxAI/Google-Photos-Delete-Tool"}'
          RESP="$(curl -sS -i -X POST \
            -H "Authorization: ApiKey $EDGE_API_KEY" \
            -H "X-ClientID: $EDGE_CLIENT_ID" \
            -H "Content-Type: application/json" \
            -d "$NOTES" \
            https://api.addons.microsoftedge.microsoft.com/v1/products/$EDGE_PRODUCT_ID/submissions || true)"
          CODE="$(printf '%s' "$RESP" | head -1 | awk '{print $2}')"
          printf '%s\n' "$RESP" | tail -20
          if [ "$CODE" != "202" ]; then
            echo "::error::Edge publish call failed (HTTP $CODE)"
            exit 1
          fi
          OP="$(printf '%s' "$RESP" | grep -io 'location:[^[:space:]]*' | head -1 | cut -d: -f2 | tr -d '\r')"
          [ -n "$OP" ] || { echo "::error::Edge publish returned 202 but no Location operation ID"; exit 1; }
          echo "op=$OP" >> "$GITHUB_OUTPUT"

      - name: Wait for Edge publish status
        id: wait
        if: steps.publish.outputs.op != ''
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            BODY="$(curl -sS -X GET \
              -H "Authorization: ApiKey $EDGE_API_KEY" \
              -H "X-ClientID: $EDGE_CLIENT_ID" \
              https://api.addons.microsoftedge.microsoft.com/v1/products/$EDGE_PRODUCT_ID/submissions/operations/${{ steps.publish.outputs.op }})"
            STATUS="$(printf '%s' "$BODY" | jq -r .status)"
            CODE="$(printf '%s' "$BODY" | jq -r .errorCode)"
            echo "edge publish status: $STATUS (attempt $i/30)"
            if [ "$STATUS" = "Succeeded" ]; then
              echo "published=yes" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$STATUS" = "Failed" ]; then
              case "$CODE" in
                InProgressSubmission)
                  echo "::notice::Edge blocked: a submission is already in progress (InProgressSubmission). The retry loop will try again later."
                  exit 0
                  ;;
                NoModulesUpdated)
                  echo "::notice::Edge reports NoModulesUpdated — no new modules to submit; public version unverified."
                  exit 0
                  ;;
                *)
                  printf '%s' "$BODY" | jq .
                  echo "::error::Edge publish failed ($CODE)"
                  exit 1
                  ;;
              esac
            fi
            sleep 20
          done
          echo "::error::Edge publish still processing after 10 minutes"
          exit 1

      - name: Record submitted state
        if: steps.wait.outputs.published == 'yes'
        run: |
          set -euo pipefail
          STATE_FILE=/tmp/store-state.json node scripts/store-state.mjs set edge ${{ needs.resolve.outputs.tag }}
          git fetch origin store-state:refs/remotes/origin/store-state --depth=1 || git fetch origin
          if git rev-parse --verify origin/store-state >/dev/null 2>&1; then
            git checkout --detach origin/store-state
          else
            git checkout --orphan store-state --quiet
            git rm -rf . --quiet
          fi
          cp /tmp/store-state.json state.json
          git add state.json
          if git diff --cached --quiet; then
            echo "No staged state changes; commit skipped"
          else
            DIFF_RC=$?
            [ "$DIFF_RC" -eq 1 ] || exit "$DIFF_RC"
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "store-state: edge=${{ needs.resolve.outputs.tag }}" --quiet
          fi
          git push origin HEAD:store-state
          echo "::notice::Edge ${{ needs.resolve.outputs.tag }} submission accepted; state recorded (public version unverified)"


  # ───────────────────────────── Firefox AMO ──────────────────────
  amo:
    name: Publish to Firefox Add-ons (AMO)
    needs: [resolve, build]
    if: contains(needs.resolve.outputs.stores, 'amo')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Credential guard
        id: creds
        env:
          HAS_AMO: ${{ secrets.FIREFOX_JWT_ISSUER != '' && secrets.FIREFOX_JWT_SECRET != '' }}
        run: |
          if [ "$HAS_AMO" = "true" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::AMO skipped: FIREFOX_JWT_ISSUER / FIREFOX_JWT_SECRET secrets not configured (see docs/STORE_AUTOMATION.md)"
            echo "ready=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Store state check
        id: state
        if: steps.creds.outputs.ready == 'yes'
        run: |
          git fetch origin store-state:refs/remotes/origin/store-state --depth=1 || true
          echo "status=$(node scripts/store-state.mjs pending amo ${{ needs.resolve.outputs.tag }})" >> "$GITHUB_OUTPUT"

      - name: Already recorded
        if: steps.creds.outputs.ready == 'yes' && steps.state.outputs.status != 'pending'
        run: echo "::notice::AMO submission already recorded for ${{ needs.resolve.outputs.tag }}; nothing to do (public version unverified)"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.creds.outputs.ready == 'yes' && steps.state.outputs.status == 'pending'
        with:
          name: store-zips
          path: zips

      - name: Publish to Firefox Add-ons
        if: steps.creds.outputs.ready == 'yes' && steps.state.outputs.status == 'pending'
        uses: wdzeng/firefox-addon@3184ee491b500e080885e046051366a4228c6e5d # v1.2.1
        with:
          addon-guid: google-photos-delete-tool@shtse8.github.io
          xpi-path: zips/google-photos-delete-tool-firefox.zip
          jwt-issuer: ${{ secrets.FIREFOX_JWT_ISSUER }}
          jwt-secret: ${{ secrets.FIREFOX_JWT_SECRET }}
          approval-notes: |
            Release ${{ needs.resolve.outputs.tag }}. Open-source extension (MIT); DOM
            automation clicks the same UI elements a human would. Source:
            https://github.com/SylphxAI/Google-Photos-Delete-Tool

      - name: Record submitted state
        if: steps.creds.outputs.ready == 'yes' && steps.state.outputs.status == 'pending'
        run: |
          set -euo pipefail
          STATE_FILE=/tmp/store-state.json node scripts/store-state.mjs set amo ${{ needs.resolve.outputs.tag }}
          git fetch origin store-state:refs/remotes/origin/store-state --depth=1 || git fetch origin
          if git rev-parse --verify origin/store-state >/dev/null 2>&1; then
            git checkout --detach origin/store-state
          else
            git checkout --orphan store-state --quiet
            git rm -rf . --quiet
          fi
          cp /tmp/store-state.json state.json
          git add state.json
          if git diff --cached --quiet; then
            echo "No staged state changes; commit skipped"
          else
            DIFF_RC=$?
            [ "$DIFF_RC" -eq 1 ] || exit "$DIFF_RC"
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "store-state: amo=${{ needs.resolve.outputs.tag }}" --quiet
          fi
          git push origin HEAD:store-state
          echo "::notice::AMO ${{ needs.resolve.outputs.tag }} submission accepted; state recorded (public version unverified)"

  cws-staged:
    name: Submit to Chrome Web Store as STAGED
    if: inputs.staged_ref != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Validate inputs
        env:
          REF: ${{ inputs.staged_ref }}
          DIGEST: ${{ inputs.content_digest }}
          TAG: ${{ inputs.tag }}
          STORES: ${{ inputs.stores }}
          CANCEL: ${{ inputs.cancel_pending }}
        run: |
          [ "$STORES" = cws ] || { echo "::error::staged_ref is CWS only"; exit 1; }
          [[ "$REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::staged_ref must be a full 40-hex commit SHA"; exit 1; }
          [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::content_digest must be 64 hex characters"; exit 1; }
          [ -z "$TAG" ] || { echo "::error::tag and staged_ref are exclusive"; exit 1; }
          [ "$CANCEL" = false ] || { echo "::error::cancel_pending is not offered on the staged path"; exit 1; }

      - name: Check out the publisher (this workflow's commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: tool
          persist-credentials: false

      - name: Check out the commit to submit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.staged_ref }}
          path: build
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: build/.bun-version

      - name: Build the store zip
        working-directory: build
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run verify
          bun run zip

      - name: Pin the package (content digest, version, untagged)
        env:
          DIGEST: ${{ inputs.content_digest }}
        run: |
          ZIP=build/google-photos-delete-tool.zip
          GOT="$(tool/scripts/zip-content-digest.sh "$ZIP")"
          VER="$(unzip -p "$ZIP" manifest.json | jq -r .version)"
          echo "zip sha256 $(sha256sum "$ZIP" | cut -d' ' -f1); content digest $GOT; manifest version $VER"
          if [ "$GOT" != "$DIGEST" ]; then
            echo "::error::content digest $GOT differs from the expected $DIGEST; nothing uploaded"
            exit 1
          fi
          if git -C build ls-remote --exit-code --tags origin "refs/tags/v$VER" >/dev/null; then
            echo "::error::v$VER is already tagged; release tags go through the normal publish path"
            exit 1
          fi
          echo "Package pinned: version \`$VER\`, content digest \`$GOT\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload and submit for review with STAGED_PUBLISH
        id: submit
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ inputs.publisher_id || secrets.CWS_PUBLISHER_ID || vars.CWS_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: node tool/scripts/cws-v2.mjs publish --zip build/google-photos-delete-tool.zip --staged

      - name: Fail when a submission is already in review
        if: steps.submit.outputs.blocked == 'yes'
        run: |
          echo "::error::CWS already has a submission in review; nothing was uploaded. Wait for it or cancel it in the dashboard, then re-run."
          exit 1
