name: Release

# Release model: a tag creates GitHub release assets ONLY. Store
# publishes (Chrome Web Store, Edge, AMO) are decoupled and stateful —
# they run through store-publish.yml (dispatch: publish-stores.yml,
# scheduled retry: store-retry.yml). This keeps a Google/Microsoft review
# queue from turning the release red (previously the tag-time CWS publish
# failed with ITEM_NOT_UPDATABLE whenever the item was in review).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    # Least privilege: only this job writes the release and the attestation.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Assert tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(bun -e 'console.log(JSON.parse(require("fs").readFileSync("package.json","utf8")).version)')"
          echo "tag=$TAG pkg=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::git tag v$PKG mismatch: release tag must match package.json version (tag=$TAG)"; exit 1; }

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Verify artifacts
        run: bun run verify

      - name: Create extension ZIPs
        run: bun run zip

      - name: Collect release assets and SHA-256 checksums
        run: |
          mkdir release-assets
          cp google-photos-delete-tool.zip google-photos-delete-tool-firefox.zip google-photos-delete-tool-edge.zip \
             dist/standalone/inject.js dist/userscript/google-photos-delete.user.js release-assets/
          (cd release-assets && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: release-assets/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
