name: Update CWS Listing (manual)

# Push the storefront/listing.json copy (title, summary, description,
# category, locale, URLs) to the Chrome Web Store via the metadata-only
# update API: PUT /chromewebstore/v1.1/items/{itemId}.
#
# Constraints (honest):
#   - Items in pending review cannot be updated (ITEM_NOT_UPDATABLE).
#     This workflow fails loudly in that state — the retry is a re-dispatch
#     after Google clears the review.
#   - Google's metadata endpoints are the only API path; if Google rejects
#     or sunsets them, the dashboard is the fallback (see
#     docs/STORE_AUTOMATION.md) — never fake a green.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Update CWS listing metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Generate + validate listing metadata
        run: |
          bun install --frozen-lockfile
          bun run listing:cws > /tmp/cws-metadata.json
          echo "payload bytes: $(wc -c < /tmp/cws-metadata.json)"

      - name: Get OAuth token
        id: token
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          TOKEN="$(curl -sS -X POST https://oauth2.googleapis.com/token \
            -d "client_id=$CHROME_CLIENT_ID" \
            -d "client_secret=$CHROME_CLIENT_SECRET" \
            -d "refresh_token=$CHROME_REFRESH_TOKEN" \
            -d 'grant_type=refresh_token' | jq -r .access_token)"
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::failed to obtain CWS OAuth token (check CHROME_CLIENT_* / CHROME_REFRESH_TOKEN secrets)"
            exit 1
          fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Push metadata to Chrome Web Store
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: |
          set -euo pipefail
          BODY="$(curl -sS -w '\n%{http_code}' -X PUT \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/cws-metadata.json \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$CHROME_EXTENSION_ID" || true)"
          CODE="$(printf '%s' "$BODY" | tail -1)"
          JSON="$(printf '%s' "$BODY" | sed '$d')"
          echo "HTTP $CODE"
          printf '%s\n' "$JSON"
          if [ "$CODE" != "200" ]; then
            if printf '%s' "$JSON" | grep -qi 'ITEM_NOT_UPDATABLE'; then
              echo "::error::CWS listing blocked: item is in pending review / ready to publish / deleted. Re-dispatch this workflow after Google clears the review (see docs/STORE_AUTOMATION.md)."
            elif [ "$CODE" = "304" ]; then
              echo "::error::CWS returned 304 Not Modified — the metadata update was NOT applied (Google returns this while the item is in review or when it ignores the request). Re-dispatch after review clears; if it persists, update the dashboard once from storefront/listing.json (single source stays the file)."
            else
              echo "::error::CWS listing update failed (HTTP $CODE)"
            fi
            exit 1
          fi
          ERRORS="$(printf '%s' "$JSON" | jq -r '.itemError | length // 0')"
          STATE="$(printf '%s' "$JSON" | jq -r '.uploadState // "?"')"
          if [ "$ERRORS" != "0" ] || [ "$STATE" != "SUCCESS" ]; then
            echo "::error::CWS reported itemError or non-SUCCESS uploadState — inspect the response above"
            exit 1
          fi
          echo "::notice::CWS listing metadata updated (uploadState=SUCCESS, itemError=[])"
