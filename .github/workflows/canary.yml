name: Selector drift canary

# Read-only live check that the selector pack still matches Google Photos.
# It never clicks delete or trash (scripts/canary/safety.ts, tests/canary.test.ts)
# and sends nothing anywhere: the only output is this run's summary and one
# issue. See docs/CANARY.md. Public-repo GitHub-hosted minutes are free.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: selector-drift-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Selector drift canary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GPDT_CANARY_STORAGE_STATE: ${{ secrets.GPDT_CANARY_STORAGE_STATE }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check for a canary session
        id: gate
        run: |
          if [ -z "$GPDT_CANARY_STORAGE_STATE" ]; then
            echo "::notice title=Canary skipped::Repo secret GPDT_CANARY_STORAGE_STATE is not set; the canary needs a disposable account session (docs/CANARY.md)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.gate.outputs.run == 'true'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.gate.outputs.run == 'true'
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: bun install --frozen-lockfile

      - name: Run canary
        id: canary
        if: steps.gate.outputs.run == 'true'
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          GPDT_CANARY_SUMMARY_FILE: ${{ runner.temp }}/canary-summary.json
        run: |
          set +e
          bun run canary
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          case "$rc" in
            0) ;;
            1) echo "::error title=Selector drift::see the summary above" ;;
            2) echo "::error title=Canary session expired::refresh GPDT_CANARY_STORAGE_STATE (not selector drift)" ;;
            *) echo "::error title=Canary error::exit $rc" ;;
          esac
          # Drift is reported through the issue below; only other failures fail the job.
          [ "$rc" -eq 0 ] || [ "$rc" -eq 1 ] || exit "$rc"

      - name: Open or update the drift issue
        if: steps.gate.outputs.run == 'true' && steps.canary.outputs.rc == '1'
        env:
          SUMMARY_FILE: ${{ runner.temp }}/canary-summary.json
        run: |
          title="Selector drift detected"
          drifted=$(jq -r '.drifted | join(", ")' "$SUMMARY_FILE")
          {
            echo "The selector-drift canary ran against a live Google Photos session and found selectors that no longer match."
            echo
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Pack version: $(jq -r .packVersion "$SUMMARY_FILE")"
            echo "- Drifted checks: $drifted"
            echo
            echo '```json'
            jq -c '.checks[] | select(.verdict != "ok")' "$SUMMARY_FILE"
            echo '```'
            echo
            echo "Next: confirm in a browser, then ship a selector-pack data patch (docs/CANARY.md, docs/RELEASE_GATE.md). The 48h clock in docs/vision.md starts at confirmation."
          } > "$RUNNER_TEMP/body.md"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
          exit 1

      - name: Upload summary
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canary-summary
          path: ${{ runner.temp }}/canary-summary.json
          if-no-files-found: ignore
          retention-days: 14
